<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101426"><title>StudyMate AI</title>
<style>
:root{--bg:#0c1020;--panel:#151b30;--p2:#1b2340;--text:#f3f5ff;--muted:#aab3d0;--a:#8b7cff;--a2:#5de0c1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20264a,var(--bg) 55%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}header{text-align:center;padding:22px 16px 16px}.logo{width:52px;height:52px;margin:0 auto 10px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--a2));font-size:27px}h1{font-size:25px;margin:0}header p,.foot{color:var(--muted)}header p{font-size:14px}.wrap{max-width:850px;margin:auto;padding:0 13px 22px}.notice{background:#292544;border:1px solid #49416e;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.55;margin-bottom:13px}.tools,.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tools button,.quick button{background:var(--p2);color:var(--text);border:1px solid #353d60;border-radius:12px;padding:9px 12px;cursor:pointer}.chat{background:#11172a;border:1px solid #29314f;border-radius:18px;min-height:43vh;max-height:55vh;overflow:auto;padding:14px}.msg{max-width:92%;padding:12px 14px;margin:9px 0;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:14px}.bot{background:var(--p2);border:1px solid #30395d}.user{background:#5549a9;margin-left:auto}form{display:flex;gap:8px;background:var(--panel);border:1px solid #323a5b;border-radius:16px;padding:8px}textarea{min-height:46px;max-height:130px;flex:1;width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px}.send{border:0;border-radius:12px;background:linear-gradient(135deg,var(--a),#6c60dc);color:white;font-weight:700;padding:0 17px}.foot{text-align:center;font-size:12px;padding:14px 5px}
</style></head><body><header><div class="logo">✦</div><h1>StudyMate AI</h1><p>ඔයාගේ AI පාඩම් සහකරු · Sinhala + English</p></header><main class="wrap"><div class="notice">📚 A/L සහ සාමාන්‍ය පාඩම්වලට උදව් ලබාගන්න ප්‍රශ්නය ලියන්න. Free server එක නිදාගෙන තිබුණොත් පළමු පිළිතුරට ටිකක් වෙලා යන්න පුළුවන්.</div><div class="tools"><button id="clear">🧹 Chat මකන්න</button><button id="download">⬇️ Chat Download</button></div><section class="chat" id="chat"></section><div class="quick"><button data-q="මට A/L Business Studies පාඩමක් සරලව කියලා දෙන්න.">📚 Business Studies</button><button data-q="මේ ප්‍රශ්නය පියවරෙන් පියවර විසඳලා දෙන්න: ">🧮 ගණන් විසඳන්න</button><button data-q="මේ මාතෘකාවට කෙටි notes සහ සාරාංශයක් හදලා දෙන්න: ">📝 Notes</button><button data-q="මට අදට පැය 2ක study plan එකක් හදලා දෙන්න.">⏰ Study plan</button></div><form id="form"><textarea id="input" placeholder="ඔයාගේ ප්‍රශ්නය මෙතැන ලියන්න..." rows="1" required></textarea><button class="send" type="submit">යවන්න ➤</button></form><div class="foot">StudyMate AI · Powered by Gemini</div></main>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('input');
const welcome='ආයුබෝවන්! 👋 මම StudyMate AI.\\n\\nඔයාගේ A/L පාඩම්, Business Studies, Accounting, notes සහ study plans ගැන මගෙන් අහන්න.';
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}add(welcome,'bot');
form.addEventListener('submit',async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add(q,'user');input.value='';const out=add('AI පිළිතුර සකස් කරමින්…','bot');const btn=form.querySelector('button');btn.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});const data=await r.json();if(!r.ok)throw Error(data.error||'Server error');out.textContent=data.reply||'පිළිතුරක් ලැබුණේ නැහැ.'}catch(err){out.textContent='AI සම්බන්ධතාවයේ ගැටලුවක්. Server එක deploy වී ඇතිද බලන්න. '+err.message}finally{btn.disabled=false}});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;input.focus()});document.getElementById('clear').onclick=()=>{chat.innerHTML='';add(welcome,'bot')};document.getElementById('download').onclick=()=>{const t=[...chat.querySelectorAll('.msg')].map(m=>(m.classList.contains('user')?'ඔයා: ':'StudyMate: ')+m.textContent).join('\\n\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='studymate-chat.txt';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
